
server.port=8080

# config
spring.application.name=englishHelper
spring.profiles.active=dev
spring.config.import=optional:configserver:http://admin:1234@localhost:9000

management.endpoint.gateway.access=read_only
management.endpoints.web.exposure.include=*

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://admin:1234@localhost:8761/eureka

spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.pattern=/auth/**
spring.cloud.gateway.routes[0].uri=http://localhost:8081

spring.cloud.gateway.routes[1].id=auth-login-logout
spring.cloud.gateway.routes[1].predicates[0]=Path=/login,/logout
spring.cloud.gateway.routes[1].uri=http://localhost:8081

spring.cloud.gateway.routes[2].id=content
spring.cloud.gateway.routes[2].predicates[0]=Path=/content/**
spring.cloud.gateway.routes[2].uri=http://localhost:8082

